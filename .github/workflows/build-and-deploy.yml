name: build-and-deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Fixed debug keystore, so every build is signed with the same key
      # and Android accepts it as an update.
      - name: Restaurar keystore de debug fija
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PversionCode=${{ github.run_number }}

      - name: Upload APK to PythonAnywhere
        env:
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            -F "content=@app/build/outputs/apk/debug/app-debug.apk" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/files/path/home/${PA_USERNAME}/ANDROID/miBT/apk/miBT.apk"

      - name: Generar manifest.json de version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cat > manifest.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/MiguelaeTxio/miBTReleases/releases/download/v${{ github.run_number }}/miBT.apk"
          }
          EOF
          echo "Manifiesto generado:"
          cat manifest.json
          python3 -m json.tool manifest.json > /dev/null && echo "[JSON OK]"

      - name: Preparar APK con nombre fijo para el asset de la Release
        run: cp app/build/outputs/apk/debug/app-debug.apk miBT.apk

      # Own Releases repository for this project, never another app's.
      - name: Publicar Release en miBTReleases
        uses: softprops/action-gh-release@v2
        with:
          repository: MiguelaeTxio/miBTReleases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: v${{ github.run_number }}
          name: miBT v${{ github.run_number }}
          files: |
            miBT.apk
            manifest.json
